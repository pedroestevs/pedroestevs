<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">Pedro Esteves</title>
  <desc id="desc">A minimal night-sky observatory scene combining orbital paths, scientific data and terminal notation</desc>
